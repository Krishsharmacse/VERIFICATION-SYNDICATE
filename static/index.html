<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verification syndicate · matrix</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Syne:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        /* ---- RESET & TOKENS ---- */
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --c-bg:        #060c14;
            --c-surface:   rgba(10, 20, 35, 0.80);
            --c-surface-2: rgba(14, 28, 48, 0.70);
            --c-border:    rgba(0, 240, 180, 0.18);
            --c-border-hi: rgba(0, 240, 180, 0.55);
            --c-accent:    #00f0b4;
            --c-accent-2:  #3d7eff;
            --c-accent-3:  #b060ff;
            --c-text:      #c8e8d8;
            --c-text-dim:  #5a8878;
            --c-text-mid:  #8ab8a8;
            --c-err:       #ff3060;
            --c-err-bg:    rgba(255, 30, 60, 0.10);
            --r-sm: 12px;
            --r-md: 18px;
            --r-lg: 24px;
            --r-xl: 32px;
            --shadow-card: 0 2px 24px rgba(0,0,0,0.55), 0 0 0 1px var(--c-border);
            --shadow-glow: 0 0 40px rgba(0,240,180,0.08);
            --shadow-focus: 0 0 0 3px rgba(0,240,180,0.22);
            --font-mono: 'Space Mono', 'Courier New', monospace;
            --font-display: 'Syne', sans-serif;
            --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
        }

        body {
            background: var(--c-bg);
            font-family: var(--font-mono);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 40px 16px 80px;
            position: relative;
            overflow-x: hidden;
        }

        /* ---- matrix rain ---- */
        #matrix-canvas {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            opacity: 0.18;
        }

        /* ---- scanline ---- */
        .scanline {
            position: fixed;
            top: -10px;
            left: 0;
            width: 100%;
            height: 8px;
            background: linear-gradient(180deg, rgba(0,240,180,0.14) 0%, transparent 100%);
            z-index: 2;
            pointer-events: none;
            animation: scan 9s linear infinite;
        }
        @keyframes scan {
            0%   { top: -10px; opacity: 0; }
            5%   { opacity: 1; }
            90%  { opacity: 0.6; }
            100% { top: 110%; opacity: 0; }
        }

        /* ---- CRT line overlay ---- */
        .glitch-panel {
            position: fixed;
            inset: 0;
            background: repeating-linear-gradient(
                0deg,
                transparent 0px,
                transparent 3px,
                rgba(0, 240, 180, 0.012) 3px,
                rgba(0, 240, 180, 0.012) 4px
            );
            z-index: 1;
            pointer-events: none;
        }

        /* ---- outer wrapper animation ---- */
        .page-enter {
            animation: pageEnter 0.6s var(--ease-out) both;
        }
        @keyframes pageEnter {
            from { opacity: 0; transform: translateY(24px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* ========================================
           MAIN CARD SHELL
        ======================================== */
        .container {
            position: relative;
            z-index: 10;
            background: var(--c-surface);
            backdrop-filter: blur(20px) saturate(160%);
            -webkit-backdrop-filter: blur(20px) saturate(160%);
            border: 1px solid var(--c-border);
            border-radius: var(--r-xl);
            box-shadow: var(--shadow-card), var(--shadow-glow);
            max-width: 680px;
            width: 100%;
            padding: 0;
            overflow: hidden;
            transition: box-shadow 0.3s var(--ease-out), border-color 0.3s;
        }
        .container:hover {
            border-color: var(--c-border-hi);
            box-shadow: var(--shadow-card), 0 0 60px rgba(0,240,180,0.10);
        }

        /* ---- inner padding regions ---- */
        .card-header   { padding: 40px 40px 32px; border-bottom: 1px solid var(--c-border); }
        .card-body     { padding: 32px 40px; }
        .card-footer   { padding: 20px 40px; border-top: 1px solid var(--c-border); background: rgba(0,0,0,0.20); }

        /* ========================================
           HEADER
        ======================================== */
        .header { text-align: center; }

        .logo-wrap {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-bottom: 20px;
        }
        .logo-glyph {
            font-size: 28px;
            color: var(--c-accent);
            filter: drop-shadow(0 0 8px var(--c-accent));
            animation: pulse-glyph 3s ease-in-out infinite alternate;
            display: inline-block;
        }
        .logo-glyph:nth-child(2) { animation-delay: 0.4s; color: var(--c-accent-2); filter: drop-shadow(0 0 8px var(--c-accent-2)); }
        .logo-glyph:nth-child(3) { animation-delay: 0.8s; color: var(--c-accent-3); filter: drop-shadow(0 0 8px var(--c-accent-3)); }
        @keyframes pulse-glyph {
            from { opacity: 0.7; transform: scale(0.95); }
            to   { opacity: 1;   transform: scale(1.08); }
        }

        h1 {
            font-family: var(--font-display);
            font-size: clamp(22px, 5vw, 32px);
            font-weight: 800;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            background: linear-gradient(120deg, var(--c-accent) 0%, var(--c-accent-2) 50%, var(--c-accent-3) 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 10px;
            line-height: 1.15;
        }

        .subtitle {
            font-family: var(--font-mono);
            color: var(--c-text-dim);
            font-size: 11px;
            letter-spacing: 0.22em;
            text-transform: uppercase;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .subtitle-dot {
            width: 5px; height: 5px;
            border-radius: 50%;
            background: var(--c-accent);
            box-shadow: 0 0 6px var(--c-accent);
            animation: pulse-led 1.5s infinite;
        }

        /* ========================================
           INPUT SECTION
        ======================================== */
        .input-group { margin-bottom: 24px; }

        .field-label {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--c-accent);
            font-size: 11px;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            margin-bottom: 10px;
            font-weight: 700;
        }
        .field-label::before {
            content: '';
            width: 3px; height: 14px;
            background: var(--c-accent);
            border-radius: 2px;
            box-shadow: 0 0 6px var(--c-accent);
        }

        .textarea-wrapper { position: relative; }

        textarea {
            width: 100%;
            padding: 18px 20px;
            background: rgba(0, 10, 20, 0.60);
            border: 1px solid rgba(0, 240, 180, 0.20);
            border-radius: var(--r-md);
            font-family: var(--font-mono);
            font-size: 14px;
            color: var(--c-text);
            resize: vertical;
            min-height: 120px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
            line-height: 1.65;
            caret-color: var(--c-accent);
        }
        textarea:hover { border-color: rgba(0,240,180,0.35); }
        textarea:focus {
            border-color: var(--c-accent);
            box-shadow: var(--shadow-focus);
            background: rgba(0, 14, 28, 0.75);
        }
        textarea::placeholder { color: var(--c-text-dim); font-style: italic; }

        /* ---- file attachment row ---- */
        .multimodal-controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 12px;
        }

        .file-input-wrapper { position: relative; }
        .file-input-wrapper input[type="file"] {
            position: absolute;
            width: 1px; height: 1px;
            opacity: 0;
            pointer-events: none;
        }

        .file-label {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 7px;
            padding: 10px 14px;
            background: rgba(0,240,180,0.04);
            border: 1px dashed rgba(0,240,180,0.22);
            border-radius: var(--r-sm);
            color: var(--c-text-mid);
            font-size: 12px;
            font-family: var(--font-mono);
            cursor: pointer;
            transition: background 0.2s, border-color 0.2s, color 0.2s, box-shadow 0.2s;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            user-select: none;
        }
        .file-label:hover {
            background: rgba(0,240,180,0.10);
            border-color: rgba(0,240,180,0.50);
            color: var(--c-accent);
            box-shadow: 0 0 12px rgba(0,240,180,0.12);
        }
        .file-label.active {
            background: rgba(0,240,180,0.12);
            border-style: solid;
            border-color: var(--c-accent);
            color: var(--c-accent);
        }

        .preview-container {
            margin-top: 12px;
            display: none;
            border: 1px solid var(--c-border);
            border-radius: var(--r-md);
            padding: 12px;
            background: rgba(0,0,0,0.40);
        }
        #imagePreview  { max-width: 100%; max-height: 200px; display: none; border-radius: 8px; margin: 0 auto; }
        #audioPreview  { width: 100%; display: none; margin-top: 6px; }

        /* ========================================
           BUTTONS
        ======================================== */
        .button-group {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 12px;
            margin-bottom: 0;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 14px 24px;
            border-radius: var(--r-sm);
            font-family: var(--font-mono);
            font-size: 13px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            cursor: pointer;
            border: none;
            outline: none;
            transition: transform 0.15s var(--ease-out), box-shadow 0.2s, background 0.2s, opacity 0.2s;
            position: relative;
            overflow: hidden;
            user-select: none;
        }
        .btn::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(90deg, transparent 0%, rgba(255,255,255,0.08) 50%, transparent 100%);
            transform: translateX(-100%);
            transition: transform 0.5s var(--ease-out);
        }
        .btn:hover:not(:disabled)::after { transform: translateX(100%); }
        .btn:active:not(:disabled) { transform: scale(0.97); }
        .btn:disabled { opacity: 0.35; cursor: not-allowed; filter: grayscale(60%); }

        .btn-primary {
            background: linear-gradient(135deg, rgba(0,240,180,0.20) 0%, rgba(61,126,255,0.20) 100%);
            border: 1px solid var(--c-accent);
            color: var(--c-accent);
            box-shadow: 0 0 20px rgba(0,240,180,0.15), inset 0 0 20px rgba(0,240,180,0.06);
        }
        .btn-primary:hover:not(:disabled) {
            background: linear-gradient(135deg, rgba(0,240,180,0.30) 0%, rgba(61,126,255,0.25) 100%);
            box-shadow: 0 0 35px rgba(0,240,180,0.30), 0 0 70px rgba(61,126,255,0.15);
            color: #fff;
        }

        .btn-ghost {
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.12);
            color: var(--c-text-mid);
            padding: 14px 20px;
        }
        .btn-ghost:hover:not(:disabled) {
            background: rgba(255,255,255,0.08);
            border-color: rgba(255,255,255,0.24);
            color: var(--c-text);
        }

        /* ========================================
           LOADING
        ======================================== */
        .loading {
            display: none;
            padding: 32px 0;
            text-align: center;
        }

        .decrypt-grid {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 6px;
            margin-bottom: 20px;
        }
        .decrypt-grid span {
            width: 8px; height: 8px;
            border-radius: 50%;
            background: var(--c-accent);
            animation: decrypt-dot 1.2s ease-in-out infinite;
        }
        .decrypt-grid span:nth-child(1) { animation-delay: 0s;    background: var(--c-accent); }
        .decrypt-grid span:nth-child(2) { animation-delay: 0.15s; background: #2effb8; }
        .decrypt-grid span:nth-child(3) { animation-delay: 0.30s; background: var(--c-accent-2); }
        .decrypt-grid span:nth-child(4) { animation-delay: 0.45s; background: var(--c-accent-3); }
        .decrypt-grid span:nth-child(5) { animation-delay: 0.60s; background: var(--c-accent); }

        @keyframes decrypt-dot {
            0%, 80%, 100% { transform: scale(1);   opacity: 0.4; }
            40%            { transform: scale(1.8); opacity: 1; box-shadow: 0 0 12px currentColor; }
        }

        .loading-text {
            color: var(--c-text-mid);
            font-size: 13px;
            letter-spacing: 0.18em;
            text-transform: uppercase;
        }
        .loading-text .cursor {
            display: inline-block;
            width: 2px; height: 14px;
            background: var(--c-accent);
            vertical-align: middle;
            margin-left: 4px;
            animation: blink 0.9s step-end infinite;
        }
        @keyframes blink { 0%,100% { opacity:1; } 50% { opacity:0; } }

        /* ========================================
           RESULT PANEL
        ======================================== */
        .result {
            display: none;
            animation: resultReveal 0.45s var(--ease-out) both;
        }
        @keyframes resultReveal {
            from { opacity: 0; transform: translateY(12px); filter: blur(4px); }
            to   { opacity: 1; transform: translateY(0);    filter: blur(0); }
        }

        /* ---- divider ---- */
        .result-divider {
            height: 1px;
            background: var(--c-border);
            margin: 28px 0;
        }

        /* ---- verdict pill ---- */
        .verdict {
            border-radius: var(--r-lg);
            padding: 24px 20px;
            text-align: center;
            border: 1px solid;
            backdrop-filter: blur(10px);
            margin-bottom: 16px;
            transition: box-shadow 0.3s;
        }
        .verdict-eyebrow {
            font-family: var(--font-mono);
            font-size: 10px;
            letter-spacing: 0.26em;
            text-transform: uppercase;
            opacity: 0.65;
            margin-bottom: 8px;
        }
        .verdict-label {
            font-family: var(--font-display);
            font-size: clamp(20px, 4vw, 28px);
            font-weight: 800;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            line-height: 1;
        }
        .verdict-sub {
            font-family: var(--font-mono);
            font-size: 11px;
            letter-spacing: 0.16em;
            opacity: 0.70;
            margin-top: 10px;
        }

        .verdict.FAKE        { background: rgba(200, 15, 45, 0.18);  border-color: rgba(255,50,90,0.55);  color: #ffb8c4; box-shadow: 0 0 40px rgba(255,30,60,0.18); }
        .verdict.LIKELY_FAKE { background: rgba(230, 100, 0, 0.18); border-color: rgba(255,120,0,0.55);  color: #ffd4a0; box-shadow: 0 0 40px rgba(255,110,0,0.18); }
        .verdict.UNCERTAIN   { background: rgba(210, 190, 0, 0.15); border-color: rgba(240,210,0,0.50);  color: #ffeea0; box-shadow: 0 0 40px rgba(220,200,0,0.15); }
        .verdict.LIKELY_TRUE { background: rgba(0, 200, 140, 0.15); border-color: rgba(0,240,160,0.50);  color: #b0ffda; box-shadow: 0 0 40px rgba(0,200,140,0.15); }
        .verdict.TRUE        { background: rgba(40, 100, 255, 0.18); border-color: rgba(80,140,255,0.55); color: #c6daff; box-shadow: 0 0 40px rgba(50,110,255,0.18); }

        /* ---- confidence bar ---- */
        .confidence {
            background: var(--c-surface-2);
            border: 1px solid var(--c-border);
            border-radius: var(--r-md);
            padding: 18px 20px;
            margin-bottom: 16px;
        }
        .confidence-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 10px;
        }
        .confidence-label {
            color: var(--c-text-dim);
            font-size: 10px;
            letter-spacing: 0.20em;
            text-transform: uppercase;
        }
        .confidence-pct {
            color: var(--c-accent);
            font-size: 13px;
            font-weight: 700;
        }
        .confidence-bar {
            height: 6px;
            background: rgba(0,0,0,0.40);
            border-radius: 99px;
            overflow: hidden;
        }
        .confidence-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--c-accent), var(--c-accent-2), var(--c-accent-3));
            border-radius: 99px;
            width: 0%;
            box-shadow: 0 0 10px rgba(0,240,180,0.50);
            transition: width 0.9s var(--ease-out);
        }

        /* ---- recommendation ---- */
        .recommendation {
            background: var(--c-surface-2);
            border: 1px solid var(--c-border);
            border-left: 3px solid var(--c-accent);
            border-radius: var(--r-md);
            padding: 16px 18px;
            color: var(--c-text);
            margin-bottom: 16px;
            font-size: 13px;
            line-height: 1.7;
        }

        /* ---- diagnostics ---- */
        .diagnostics {
            background: var(--c-surface-2);
            border: 1px solid var(--c-border);
            border-radius: var(--r-md);
            padding: 18px 20px;
            margin-bottom: 16px;
            font-size: 12px;
        }
        .diag-header {
            color: var(--c-accent);
            font-size: 10px;
            letter-spacing: 0.22em;
            text-transform: uppercase;
            margin-bottom: 14px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--c-border);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .diag-header::before {
            content: '';
            width: 6px; height: 6px;
            border-radius: 50%;
            background: var(--c-accent);
            box-shadow: 0 0 6px var(--c-accent);
            animation: pulse-led 1.5s infinite;
        }
        .diag-item {
            margin-bottom: 10px;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .diag-item:last-child { margin-bottom: 0; }
        .diag-label {
            color: var(--c-text-dim);
            font-size: 10px;
            letter-spacing: 0.14em;
            text-transform: uppercase;
        }
        .diag-value {
            color: var(--c-text);
            background: rgba(0,0,0,0.35);
            padding: 7px 12px;
            border-radius: 8px;
            font-family: var(--font-mono);
            font-size: 12px;
            border-left: 2px solid var(--c-accent);
            word-break: break-all;
        }

        /* ---- tips ---- */
        .tips-section {
            background: var(--c-surface-2);
            border: 1px solid var(--c-border);
            border-radius: var(--r-md);
            padding: 18px 20px;
        }
        .tips-title {
            color: var(--c-accent);
            font-size: 10px;
            letter-spacing: 0.22em;
            text-transform: uppercase;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .tips-title::before {
            content: '⫸';
            font-size: 14px;
        }
        .tips-list { list-style: none; }
        .tips-list li {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            padding: 8px 0;
            color: var(--c-text-mid);
            border-bottom: 1px solid var(--c-border);
            font-size: 13px;
            line-height: 1.55;
        }
        .tips-list li:last-child { border-bottom: none; padding-bottom: 0; }
        .tips-list li::before {
            content: '›';
            color: var(--c-accent);
            font-size: 16px;
            line-height: 1.3;
            flex-shrink: 0;
        }

        /* ========================================
           ERROR BOX
        ======================================== */
        .error {
            background: var(--c-err-bg);
            border: 1px solid rgba(255,30,60,0.35);
            border-radius: var(--r-md);
            padding: 14px 18px;
            color: #ff9aaa;
            display: none;
            margin-bottom: 20px;
            font-size: 13px;
        }

        /* ========================================
           STATUS BAR
        ======================================== */
        .status {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            color: var(--c-text-dim);
            font-size: 11px;
            letter-spacing: 0.14em;
            text-transform: uppercase;
        }
        .pulse-dot {
            width: 7px; height: 7px;
            border-radius: 50%;
            flex-shrink: 0;
        }
        .status.online  .pulse-dot { background: var(--c-accent); box-shadow: 0 0 8px var(--c-accent); animation: pulse-led 1.5s infinite; }
        .status.offline .pulse-dot { background: var(--c-err);    box-shadow: 0 0 8px var(--c-err);    animation: pulse-led 1.5s infinite; }

        @keyframes pulse-led {
            0%, 100% { opacity: 1; }
            50%       { opacity: 0.35; }
        }

        /* ========================================
           RESPONSIVE
        ======================================== */
        @media (max-width: 520px) {
            body { padding: 16px 12px 60px; }
            .card-header  { padding: 28px 24px 24px; }
            .card-body    { padding: 24px 24px; }
            .card-footer  { padding: 16px 24px; }
            .button-group { grid-template-columns: 1fr; }
            .btn-ghost    { display: none; }
            .multimodal-controls { grid-template-columns: 1fr 1fr; }
        }
        @media (max-width: 360px) {
            .card-header  { padding: 20px 16px 18px; }
            .card-body    { padding: 18px 16px; }
            .card-footer  { padding: 14px 16px; }
            .multimodal-controls { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<canvas id="matrix-canvas"></canvas>
<div class="scanline"></div>
<div class="glitch-panel"></div>

<div class="container page-enter">

    <!-- HEADER -->
    <div class="card-header">
        <div class="header">
            <div class="logo-wrap">
                <span class="logo-glyph">⧩</span>
                <span class="logo-glyph">⧯</span>
                <span class="logo-glyph">⧫</span>
            </div>
            <h1>Verification Syndicate</h1>
            <p class="subtitle">
                <span class="subtitle-dot"></span>
                #truth_decoder · green v1.0
            </p>
        </div>
    </div>

    <!-- BODY -->
    <div class="card-body">

        <div class="error" id="error"></div>

        <!-- Input -->
        <div class="input-group">
            <div class="field-label">Inject message to audit</div>
            <div class="textarea-wrapper">
                <textarea id="textInput" placeholder="e.g., 'Secret chip in vaccines' — paste any claim here…" rows="5"></textarea>
            </div>
            <div class="multimodal-controls">
                <div class="file-input-wrapper">
                    <input type="file" id="imageInput" accept="image/*" onchange="handleFileSelect('image')">
                    <label for="imageInput" class="file-label" id="imageLabel">
                        <span>📷 Attach Image</span>
                    </label>
                </div>
                <div class="file-input-wrapper">
                    <input type="file" id="audioInput" accept="audio/*" onchange="handleFileSelect('audio')">
                    <label for="audioInput" class="file-label" id="audioLabel">
                        <span>🎤 Attach Audio</span>
                    </label>
                </div>
            </div>
            <div class="preview-container" id="previewContainer">
                <img id="imagePreview" src="">
                <audio id="audioPreview" controls></audio>
            </div>
        </div>

        <!-- Buttons -->
        <div class="button-group">
            <button class="btn btn-primary" id="verifyBtn" onclick="verifyMessage()">
                ⧗ &nbsp;Verify Now
                <span style="font-size:10px;opacity:0.6;margin-left:4px;">ctrl+↵</span>
            </button>
            <button class="btn btn-ghost" id="clearBtn" onclick="clearInput()">⧬ Clear</button>
        </div>

        <!-- Loading -->
        <div class="loading" id="loading">
            <div class="decrypt-grid">
                <span></span><span></span><span></span><span></span><span></span>
            </div>
            <div class="loading-text">Decrypting signal<span class="cursor"></span></div>
        </div>

        <!-- Result -->
        <div class="result" id="result">
            <div class="result-divider"></div>

            <div class="verdict" id="verdictBox"></div>

            <div class="confidence" id="confidenceBox"></div>

            <div class="diagnostics" id="diagnosticsBox" style="display:none;">
                <div class="diag-header">Agent Telemetry</div>
                <div class="diag-item" id="diagTranslator">
                    <span class="diag-label">[Node C] Translator Agent</span>
                    <span class="diag-value"></span>
                </div>
                <div class="diag-item" id="diagSentiment">
                    <span class="diag-label">[Node D] NovEmoFake — Sentiment &amp; Emotion</span>
                    <span class="diag-value"></span>
                </div>
                <div class="diag-item" id="diagRag">
                    <span class="diag-label">[Node E] RAG Vector Search</span>
                    <span class="diag-value"></span>
                </div>
                <div class="diag-item" id="diagDuckDuckGo">
                    <span class="diag-label">[Node F] DuckDuckGo Verification</span>
                    <span class="diag-value"></span>
                </div>
            </div>

            <div class="recommendation" id="recommendationBox"></div>

            <div class="tips-section" id="tipsSection" style="display:none;">
                <div class="tips-title">Verification tips</div>
                <ul class="tips-list" id="tipsList"></ul>
            </div>
        </div>

    </div><!-- /card-body -->

    <!-- FOOTER STATUS -->
    <div class="card-footer">
        <div class="status offline" id="status">
            <span class="pulse-dot"></span>
            <span id="statusText">Checking secure link…</span>
        </div>
    </div>

</div><!-- /container -->

<script>
/* ======================================================
   MATRIX RAIN
====================================================== */
const canvas = document.getElementById('matrix-canvas');
const ctx    = canvas.getContext('2d');

function resizeCanvas() {
    canvas.width  = window.innerWidth;
    canvas.height = window.innerHeight;
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

const chars   = '01アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワヲン';
const fontSize = 16;
let drops;
function initDrops() {
    const cols = Math.floor(canvas.width / fontSize);
    drops = Array(cols).fill(1);
}
initDrops();
window.addEventListener('resize', initDrops);

function drawMatrix() {
    ctx.fillStyle = 'rgba(6, 12, 20, 0.05)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#00f0b4';
    ctx.font = fontSize + 'px "Space Mono", monospace';
    for (let i = 0; i < drops.length; i++) {
        const text = chars[Math.floor(Math.random() * chars.length)];
        ctx.fillText(text, i * fontSize, drops[i] * fontSize);
        if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
        drops[i] += 0.75;
    }
}
setInterval(drawMatrix, 48);

/* ======================================================
   STATE & API
====================================================== */
const API_URL = '/api/verify';

function handleFileSelect(type) {
    const input   = document.getElementById(type + 'Input');
    const label   = document.getElementById(type + 'Label');
    const preview = document.getElementById('previewContainer');
    const imgEl   = document.getElementById('imagePreview');
    const audEl   = document.getElementById('audioPreview');

    if (input.files && input.files[0]) {
        label.classList.add('active');
        const name = input.files[0].name;
        label.querySelector('span').textContent = '✓ ' + (name.length > 16 ? name.substring(0, 14) + '…' : name);
        preview.style.display = 'block';
        const reader = new FileReader();
        reader.onload = e => {
            if (type === 'image') { imgEl.src = e.target.result; imgEl.style.display = 'block'; }
            else                  { audEl.src = e.target.result; audEl.style.display = 'block'; }
        };
        reader.readAsDataURL(input.files[0]);
    }
}

async function checkStatus() {
    return new Promise(resolve => {
        setTimeout(() => { updateStatus(true); resolve(true); }, 300);
    });
}

function updateStatus(online) {
    const el   = document.getElementById('status');
    const txt  = document.getElementById('statusText');
    const vBtn = document.getElementById('verifyBtn');
    if (online) {
        el.classList.add('online');  el.classList.remove('offline');
        txt.textContent = '⏚ Secure link established · Encrypted';
        vBtn.disabled = false;
    } else {
        el.classList.add('offline'); el.classList.remove('online');
        txt.textContent = '✗ Connection lost · Retry';
        vBtn.disabled = true;
    }
}

async function verifyMessage() {
    const text       = document.getElementById('textInput').value.trim();
    const imageInput = document.getElementById('imageInput');
    const audioInput = document.getElementById('audioInput');
    const errorEl    = document.getElementById('error');
    const resultEl   = document.getElementById('result');
    const loadingEl  = document.getElementById('loading');
    const vBtn       = document.getElementById('verifyBtn');

    errorEl.style.display = 'none';
    if (!text && !imageInput.files[0] && !audioInput.files[0]) {
        errorEl.textContent = '⛔ Input required — provide text, image, or audio.';
        errorEl.style.display = 'block';
        return;
    }

    resultEl.style.display = 'none';
    loadingEl.style.display = 'block';
    vBtn.disabled = true;

    const formData = new FormData();
    if (text)                 formData.append('text',  text);
    if (imageInput.files[0]) formData.append('image', imageInput.files[0]);
    if (audioInput.files[0]) formData.append('audio', audioInput.files[0]);

    try {
        const response = await fetch(API_URL, { method: 'POST', body: formData });
        const data     = await response.json();
        if (data.success) {
            displayResultFromBackend(data);
            loadingEl.style.display = 'none';
            resultEl.style.display  = 'block';
        } else {
            throw new Error(data.error || 'Unknown server error');
        }
    } catch (e) {
        console.error('API Error:', e);
        errorEl.textContent = `⚠️ Audit failure: ${e.message}`;
        errorEl.style.display = 'block';
        loadingEl.style.display = 'none';
    } finally {
        vBtn.disabled = false;
        checkStatus();
    }
}

function displayResultFromBackend(data) {
    const verdictBox     = document.getElementById('verdictBox');
    const confidenceBox  = document.getElementById('confidenceBox');
    const recBox         = document.getElementById('recommendationBox');
    const diagBox        = document.getElementById('diagnosticsBox');
    const diagTrans      = document.querySelector('#diagTranslator .diag-value');
    const diagSent       = document.querySelector('#diagSentiment .diag-value');
    const diagRag        = document.querySelector('#diagRag .diag-value');
    const diagDuck       = document.querySelector('#diagDuckDuckGo .diag-value');
    const tipsSection    = document.getElementById('tipsSection');
    const tipsList       = document.getElementById('tipsList');

    const judgment     = data.judgment || {};
    const verdict      = judgment.final_verdict || 'UNCERTAIN';
    const confidence   = judgment.fake_probability || 0.5;
    const recommendation = judgment.recommendation || data.response || 'Verify from multiple angles.';
    const tips         = data.verification_tips || [];

    verdictBox.className = `verdict ${verdict}`;
    verdictBox.innerHTML = `
        <div class="verdict-eyebrow">Verdict</div>
        <div class="verdict-label">${verdict.replace(/_/g, ' ')}</div>
        <div class="verdict-sub">Certainty index: ${(confidence * 100).toFixed(0)}%</div>
    `;

    confidenceBox.innerHTML = `
        <div class="confidence-header">
            <span class="confidence-label">Misinformation probability</span>
            <span class="confidence-pct">${(confidence * 100).toFixed(1)}%</span>
        </div>
        <div class="confidence-bar">
            <div class="confidence-fill" id="confFill"></div>
        </div>
    `;
    // animate fill after DOM paint
    requestAnimationFrame(() => {
        requestAnimationFrame(() => {
            const fill = document.getElementById('confFill');
            if (fill) fill.style.width = (confidence * 100) + '%';
        });
    });

    diagBox.style.display = 'block';
    diagTrans.textContent = data.processing_stage || 'Completed';
    diagSent.textContent  = judgment.emotional_markers ? JSON.stringify(judgment.emotional_markers) : 'N/A';
    diagRag.textContent   = data.educational_content  ? 'Found context' : 'No direct match';
    diagDuck.textContent  = data.success ? 'Audit successful' : 'Service offline';

    recBox.textContent = recommendation;

    if (tips && tips.length) {
        tipsSection.style.display = 'block';
        tipsList.innerHTML = tips.map(t => `<li>${t}</li>`).join('');
    } else if (data.educational_content) {
        tipsSection.style.display = 'block';
        tipsList.innerHTML = `<li>${data.educational_content.substring(0, 120)}…</li>`;
    } else {
        tipsSection.style.display = 'none';
    }
}

function clearInput() {
    ['textInput'].forEach(id => document.getElementById(id).value = '');
    ['imageInput','audioInput'].forEach(id => document.getElementById(id).value = '');
    ['imageLabel','audioLabel'].forEach(id => {
        const el = document.getElementById(id);
        el.classList.remove('active');
    });
    document.getElementById('imageLabel').querySelector('span').textContent = '📷 Attach Image';
    document.getElementById('audioLabel').querySelector('span').textContent = '🎤 Attach Audio';
    document.getElementById('previewContainer').style.display = 'none';
    document.getElementById('imagePreview').style.display    = 'none';
    document.getElementById('audioPreview').style.display    = 'none';
    document.getElementById('result').style.display   = 'none';
    document.getElementById('loading').style.display  = 'none';
    document.getElementById('error').style.display    = 'none';
    document.getElementById('textInput').focus();
}

document.getElementById('textInput').addEventListener('keydown', e => {
    if (e.ctrlKey && e.key === 'Enter') verifyMessage();
});

window.addEventListener('load', () => {
    document.getElementById('textInput').focus();
    checkStatus();
});

setInterval(() => checkStatus(), 8000);
</script>
</body>
</html>
